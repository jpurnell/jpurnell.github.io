description: |
  quality-gate-swift is a modular, AST-powered static-analysis gate for Swift —
  42 checkers that make it physically impossible to commit code that violates
  your standards. Its companion, the Institutional Judgment System, captures the
  reasoning behind every override and feeds that memory back into the next run.
  One is a gate; the other is a mirror. This book walks through both, checker by
  checker and layer by layer, and traces the Bridgewater lineage that shaped the
  judgment half — plus a compliance layer that reports coverage across SOC 2,
  ISO 27001, and HIPAA without ever claiming a badge it can't earn.

<svg xmlns="http://www.w3.org/2000/svg" class="ig" role="img" aria-label="BusinessMathMCP statistics" width="600" height="164" viewBox="0 0 600 164">
  <style>
    svg.ig {
      --ig-label: #111214;
      --ig-secondary-label: #6A6D72;
      --ig-background: #FAFAFA;
      --ig-secondary-background: #FFFFFF;
      --ig-separator: #D6D8DB;
      --ig-series-1: #FF8D28;
      --ig-series-2: #6155F5;
      --ig-series-3: #34C759;
      --ig-series-4: #CB30E0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    svg.ig .ig-bg { fill: var(--background, var(--ig-background)); }
    svg.ig .ig-rule { fill: var(--label, var(--ig-label)); }
    svg.ig .ig-hair { stroke: var(--separator, var(--ig-separator)); stroke-width: 1; }
    svg.ig .ig-label { fill: var(--label, var(--ig-label)); }
    svg.ig .ig-muted { fill: var(--secondary-label, var(--ig-secondary-label)); }
    svg.ig .ig-bar, svg.ig .ig-dot, svg.ig .ig-s1 { fill: var(--series-1, var(--ig-series-1)); }
    svg.ig .ig-hole { fill: var(--background, var(--ig-background)); }
    svg.ig .ig-s2 { fill: var(--series-2, var(--ig-series-2)); }
    svg.ig .ig-s3 { fill: var(--series-3, var(--ig-series-3)); }
    svg.ig .ig-s4 { fill: var(--series-4, var(--ig-series-4)); }
    @media (prefers-color-scheme: dark) {
      svg.ig {
        --ig-label: #F2F2EF;
        --ig-secondary-label: #9A9DA2;
        --ig-background: #101112;
        --ig-secondary-background: #17181A;
        --ig-separator: #2E3033;
        --ig-series-1: #FF9230;
        --ig-series-2: #6D7CFF;
        --ig-series-3: #30D158;
        --ig-series-4: #DB34F2;
      }
    }
    @media (prefers-contrast: more) {
      svg.ig {
        --ig-series-1: #C55300;
        --ig-series-2: #564ADE;
        --ig-series-3: #008932;
        --ig-series-4: #B02FC2;
      }
    }
    @media (prefers-contrast: more) and (prefers-color-scheme: dark) {
      svg.ig {
        --ig-series-1: #FFA056;
        --ig-series-2: #A7AAFF;
        --ig-series-3: #4AD968;
        --ig-series-4: #EA8DFF;
      }
    }
  </style>
  <rect class="ig-bg" x="0" y="0" width="600" height="164"/>
  <text class="ig-label" x="24" y="32" font-size="18" font-weight="700" letter-spacing="-0.4">BusinessMathMCP</text>
  <rect class="ig-rule" x="24" y="44" width="552" height="3"/>
  <rect class="ig-s1" x="24" y="68" width="24" height="3"/>
  <text class="ig-label" x="24" y="106" font-size="30" font-weight="700" letter-spacing="-0.6">93</text>
  <text class="ig-muted" x="24" y="126" font-size="11" font-weight="600" letter-spacing="0.9">COMMITS</text>
  <rect class="ig-s2" x="208" y="68" width="24" height="3"/>
  <text class="ig-label" x="208" y="106" font-size="30" font-weight="700" letter-spacing="-0.6">1</text>
  <text class="ig-muted" x="208" y="126" font-size="11" font-weight="600" letter-spacing="0.9">RELEASES</text>
  <rect class="ig-s3" x="392" y="68" width="24" height="3"/>
  <text class="ig-label" x="392" y="106" font-size="30" font-weight="700" letter-spacing="-0.6">1</text>
  <text class="ig-muted" x="392" y="126" font-size="11" font-weight="600" letter-spacing="0.9">PLATFORMS</text>
  <text class="ig-muted" x="24" y="150" font-size="11">2 contributors</text>
</svg>
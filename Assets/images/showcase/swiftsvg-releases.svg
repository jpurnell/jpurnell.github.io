<svg xmlns="http://www.w3.org/2000/svg" width="600" height="180" viewBox="0 0 600 180">
  <style>
    svg {
      --label: #111214;
      --secondary-label: #6A6D72;
      --background: #FAFAFA;
      --secondary-background: #FFFFFF;
      --separator: #D6D8DB;
      --series-1: #FF8D28;
      --series-2: #6155F5;
      --series-3: #34C759;
      --series-4: #CB30E0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    .bg { fill: var(--background); }
    .card { fill: var(--secondary-background); }
    .frame { fill: none; stroke: var(--separator); stroke-width: 1; }
    .rule { fill: var(--label); }
    .hair { stroke: var(--separator); stroke-width: 1; }
    .label { fill: var(--label); }
    .muted { fill: var(--secondary-label); }
    .bar { fill: var(--series-1); }
    .dot { fill: var(--series-1); }
    .hole { fill: var(--background); }
    .s1 { fill: var(--series-1); }
    .s2 { fill: var(--series-2); }
    .s3 { fill: var(--series-3); }
    .s4 { fill: var(--series-4); }
    @media (prefers-color-scheme: dark) {
      svg {
        --label: #F2F2EF;
        --secondary-label: #9A9DA2;
        --background: #101112;
        --secondary-background: #17181A;
        --separator: #2E3033;
        --series-1: #FF9230;
        --series-2: #6D7CFF;
        --series-3: #30D158;
        --series-4: #DB34F2;
      }
    }
    @media (prefers-contrast: more) {
      svg {
        --series-1: #C55300;
        --series-2: #564ADE;
        --series-3: #008932;
        --series-4: #B02FC2;
      }
    }
    @media (prefers-contrast: more) and (prefers-color-scheme: dark) {
      svg {
        --series-1: #FFA056;
        --series-2: #A7AAFF;
        --series-3: #4AD968;
        --series-4: #EA8DFF;
      }
    }
  </style>
  <rect class="bg" x="0" y="0" width="600" height="180"/>
  <rect class="frame" x="0.5" y="0.5" width="599" height="179"/>
  <rect class="rule" x="0" y="0" width="600" height="3"/>
  <text class="label" x="60" y="34" font-size="16" font-weight="700" letter-spacing="-0.3">SwiftSVG — Releases</text>
  <line class="hair" x1="60" y1="100" x2="540" y2="100"/>
  <circle class="dot" cx="300" cy="100" r="6"/>
  <circle class="hole" cx="300" cy="100" r="3"/>
  <text x="300" y="82" class="label" font-size="12" font-weight="700" text-anchor="middle">0.1.0</text>
<text x="300" y="68" class="muted" font-size="9" text-anchor="middle">2026-06-07</text>
</svg>
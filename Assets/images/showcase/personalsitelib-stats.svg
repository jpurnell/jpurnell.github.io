<svg xmlns="http://www.w3.org/2000/svg" width="460" height="220" viewBox="0 0 460 220">
  <style>
    svg {
      --label: #111214;
      --secondary-label: #6A6D72;
      --background: #FAFAFA;
      --secondary-background: #FFFFFF;
      --separator: #D6D8DB;
      --series-1: #FF8D28;
      --series-2: #6155F5;
      --series-3: #34C759;
      --series-4: #CB30E0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    .bg { fill: var(--background); }
    .card { fill: var(--secondary-background); }
    .frame { fill: none; stroke: var(--separator); stroke-width: 1; }
    .rule { fill: var(--label); }
    .hair { stroke: var(--separator); stroke-width: 1; }
    .label { fill: var(--label); }
    .muted { fill: var(--secondary-label); }
    .bar { fill: var(--series-1); }
    .dot { fill: var(--series-1); }
    .hole { fill: var(--background); }
    .s1 { fill: var(--series-1); }
    .s2 { fill: var(--series-2); }
    .s3 { fill: var(--series-3); }
    .s4 { fill: var(--series-4); }
    @media (prefers-color-scheme: dark) {
      svg {
        --label: #F2F2EF;
        --secondary-label: #9A9DA2;
        --background: #101112;
        --secondary-background: #17181A;
        --separator: #2E3033;
        --series-1: #FF9230;
        --series-2: #6D7CFF;
        --series-3: #30D158;
        --series-4: #DB34F2;
      }
    }
    @media (prefers-contrast: more) {
      svg {
        --series-1: #C55300;
        --series-2: #564ADE;
        --series-3: #008932;
        --series-4: #B02FC2;
      }
    }
    @media (prefers-contrast: more) and (prefers-color-scheme: dark) {
      svg {
        --series-1: #FFA056;
        --series-2: #A7AAFF;
        --series-3: #4AD968;
        --series-4: #EA8DFF;
      }
    }
  </style>
  <rect class="bg" x="0" y="0" width="460" height="220"/>
  <rect class="frame" x="0.5" y="0.5" width="459" height="219"/>
  <rect class="rule" x="0" y="0" width="460" height="3"/>
  <text class="label" x="24" y="44" font-size="20" font-weight="700" letter-spacing="-0.4">PersonalSiteLib</text>
  <line class="hair" x1="24" y1="62" x2="436" y2="62"/>
  <rect class="s1" x="24" y="80" width="24" height="3"/>
  <text class="label" x="24" y="124" font-size="28" font-weight="700" letter-spacing="-0.6">275</text>
  <text class="muted" x="24" y="146" font-size="11" font-weight="600" letter-spacing="0.9">COMMITS</text>
  <rect class="s2" x="161" y="80" width="24" height="3"/>
  <text class="label" x="161" y="124" font-size="28" font-weight="700" letter-spacing="-0.6">0</text>
  <text class="muted" x="161" y="146" font-size="11" font-weight="600" letter-spacing="0.9">RELEASES</text>
  <rect class="s3" x="298" y="80" width="24" height="3"/>
  <text class="label" x="298" y="124" font-size="28" font-weight="700" letter-spacing="-0.6">2</text>
  <text class="muted" x="298" y="146" font-size="11" font-weight="600" letter-spacing="0.9">PLATFORMS</text>
  <text class="muted" x="24" y="198" font-size="11">2 contributors</text>
</svg>